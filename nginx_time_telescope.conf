server {
    listen 80;
    server_name time_telescope.ara.roma.it;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name time_telescope.ara.roma.it;

    # Certificati SSL — adattare al percorso usato dagli altri servizi
    ssl_certificate     /etc/ssl/certs/ara.roma.it.crt;
    ssl_certificate_key /etc/ssl/private/ara.roma.it.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ─── Autenticazione Authelia (ForwardAuth) ───────────────────────────────
    # Verifica la sessione senza inoltrare il corpo della richiesta.
    # Dalla 4.38 l'endpoint è /api/authz/forward-auth; sulle versioni
    # precedenti era /api/verify.
    location /internal/authelia {
        internal;
        proxy_pass              http://127.0.0.1:9091/api/authz/forward-auth;
        proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header        Content-Length "";
        proxy_pass_request_body off;
    }

    # Proxy verso il container
    location / {
        # Pagine e API stanno sullo stesso upstream: si proteggono insieme.
        auth_request     /internal/authelia;
        auth_request_set $auth_user   $upstream_http_remote_user;
        auth_request_set $auth_groups $upstream_http_remote_groups;
        auth_request_set $auth_email  $upstream_http_remote_email;

        # Identità passata all'applicazione. Le tre righe seguenti sono anche
        # ciò che impedisce a un client di iniettarli da sé: qui vengono
        # sempre riscritti con i valori verificati da Authelia.
        proxy_set_header Remote-User   $auth_user;
        proxy_set_header Remote-Groups $auth_groups;
        proxy_set_header Remote-Email  $auth_email;

        error_page 401 =302 https://auth.ara.roma.it/?rd=$scheme://$http_host$request_uri;

        proxy_pass         http://127.0.0.1:8010;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Utile per evitare timeout su richieste lente
        proxy_read_timeout 60s;
    }
}
