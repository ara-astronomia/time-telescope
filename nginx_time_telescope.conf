server {
    listen 80;
    server_name time_telescope.ara.roma.it;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name time_telescope.ara.roma.it;

    # Certificati SSL — adattare al percorso usato dagli altri servizi
    ssl_certificate     /etc/ssl/certs/ara.roma.it.crt;
    ssl_certificate_key /etc/ssl/private/ara.roma.it.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Proxy verso il container
    location / {
        proxy_pass         http://127.0.0.1:8010;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Utile per evitorn timeout su richieste lente
        proxy_read_timeout 60s;
    }
}
