[project]
name = "telescope-time"
version = "1.0.0"
description = "Telescope time request management — CRaC"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.13.0",
    "python-multipart>=0.0.27",
    "sqlalchemy>=2.0.52",
    "pymysql>=1.2.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=8.0.0",
    "pytest-playwright>=0.5.0",
]

[tool.uv]
# Not a package to install: main.py and router.py are root-level modules.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette's TestClient warns when it uses httpx instead of httpx2:
# treating it as an error stops a silent regression back to httpx.
filterwarnings = [
    "error::DeprecationWarning",
    "error::UserWarning",
]
