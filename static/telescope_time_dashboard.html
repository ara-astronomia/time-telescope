<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRaC — Dashboard Tempo Telescopio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0a0c10;
    --surface:   #111318;
    --surface2:  #161920;
    --border:    #1e2230;
    --border-hi: #2e3450;
    --accent:    #4f7cff;
    --accent-lo: rgba(79,124,255,0.12);
    --green:     #2dce89;
    --green-lo:  rgba(45,206,137,0.12);
    --red:       #ff4d6d;
    --red-lo:    rgba(255,77,109,0.12);
    --amber:     #ffc107;
    --amber-lo:  rgba(255,193,7,0.10);
    --text:      #e2e8f0;
    --text-dim:  #64748b;
    --text-mid:  #94a3b8;
    --mono:      'Space Mono', monospace;
    --sans:      'Syne', sans-serif;
    --radius:    10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 15%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 10%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 45%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 8%  85%, rgba(255,255,255,0.5) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 1000px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 2rem;
    animation: fadeDown 0.5s ease both;
  }
  .header-left .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--amber);
    background: var(--amber-lo);
    border: 1px solid rgba(255,193,7,0.2);
    border-radius: 999px;
    padding: 0.25rem 0.9rem;
    margin-bottom: 0.8rem;
  }
  .header-left h1 {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .header-left h1 span { color: var(--amber); }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.4rem; }
  .header-actions { display: flex; gap: 0.6rem; align-items: center; }

  /* Stats bar */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.8rem;
    margin-bottom: 1.8rem;
    animation: fadeUp 0.5s ease 0.1s both;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }
  .stat-card .val {
    font-size: 1.8rem;
    font-weight: 800;
    font-family: var(--mono);
    line-height: 1;
  }
  .stat-card .lbl {
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    font-family: var(--mono);
  }
  .stat-card.attesa  .val { color: var(--amber); }
  .stat-card.approv  .val { color: var(--green); }
  .stat-card.rifiut  .val { color: var(--red); }

  /* Filter bar */
  .filter-bar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.4rem;
    flex-wrap: wrap;
    animation: fadeUp 0.5s ease 0.15s both;
  }
  .filter-btn {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    padding: 0.4rem 1rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--border-hi); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filter-btn.active.f-attesa  { background: var(--amber); border-color: var(--amber); }
  .filter-btn.active.f-approv  { background: var(--green); border-color: var(--green); }
  .filter-btn.active.f-rifiut  { background: var(--red);   border-color: var(--red); }

  /* Richieste list */
  .list { animation: fadeUp 0.5s ease 0.2s both; }

  .richiesta-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 0.9rem;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .richiesta-card:hover { border-color: var(--border-hi); }

  .richiesta-card.stato-in_attesa  { border-left: 3px solid var(--amber); }
  .richiesta-card.stato-approvata  { border-left: 3px solid var(--green); }
  .richiesta-card.stato-rifiutata  { border-left: 3px solid var(--red);   }

  .rc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.8rem;
    padding: 1rem 1.2rem;
    cursor: pointer;
    user-select: none;
  }
  .rc-header:hover { background: rgba(255,255,255,0.02); }

  .rc-left { display: flex; flex-direction: column; gap: 0.3rem; }
  .rc-nome-ricerca {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }
  .rc-meta {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text-mid);
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .rc-meta span { display: flex; align-items: center; gap: 0.35rem; }

  .stato-badge {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    padding: 0.25rem 0.8rem;
    border-radius: 999px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .stato-in_attesa  { background: var(--amber-lo); color: var(--amber); border: 1px solid rgba(255,193,7,0.25); }
  .stato-approvata  { background: var(--green-lo); color: var(--green); border: 1px solid rgba(45,206,137,0.25); }
  .stato-rifiutata  { background: var(--red-lo);   color: var(--red);   border: 1px solid rgba(255,77,109,0.25); }

  /* Expand detail */
  .rc-detail {
    display: none;
    padding: 0 1.2rem 1.2rem;
    border-top: 1px solid var(--border);
    animation: fadeUp 0.25s ease both;
  }
  .rc-detail.open { display: block; }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.8rem;
    margin: 1rem 0;
  }
  .detail-item {}
  .detail-item .dl { font-family: var(--mono); font-size: 0.65rem; color: var(--text-dim); letter-spacing: 0.1em; margin-bottom: 0.2rem; }
  .detail-item .dv { font-size: 0.9rem; color: var(--text); }

  .descrizione-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.8rem;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--text-mid);
    margin-bottom: 1rem;
    white-space: pre-wrap;
    line-height: 1.6;
  }

  /* Action area */
  .action-area {
    display: flex;
    gap: 0.6rem;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .note-input {
    flex: 1;
    min-width: 200px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.82rem;
    padding: 0.5rem 0.8rem;
    outline: none;
    transition: border-color 0.2s;
    resize: none;
    height: 38px;
  }
  .note-input:focus { border-color: var(--accent); }

  .btn-approve, .btn-reject {
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    padding: 0.5rem 1.1rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 700;
    transition: opacity 0.2s, transform 0.15s;
    height: 38px;
  }
  .storico-box {
    margin-top: 0.8rem; padding-top: 0.8rem;
    border-top: 1px solid var(--border);
  }
  .storico { font-family: var(--mono); font-size: 0.72rem; margin-top: 0.4rem; }
  .storico .voce {
    display: flex; gap: 0.6rem; flex-wrap: wrap;
    padding: 0.3rem 0; color: var(--text-mid);
  }
  .storico .quando { color: var(--text-dim); min-width: 130px; }
  .storico .chi    { color: var(--accent); }
  .storico .nota   { color: var(--text-dim); font-style: italic; }
  .storico .vuoto  { color: var(--text-dim); padding: 0.3rem 0; }

  .sposta-area {
    display: flex; gap: 0.6rem; align-items: flex-end; flex-wrap: wrap;
    margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px solid var(--border);
  }
  .sposta-campo { display: flex; flex-direction: column; gap: 0.25rem; }
  .sposta-campo .dl { font-size: 0.62rem; }
  .sposta-campo input { min-width: 190px; }

  .btn-sposta {
    font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.05em;
    padding: 0.5rem 1.1rem; border-radius: 8px; cursor: pointer;
    font-weight: 700; height: 38px;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent);
    transition: background 0.2s, transform 0.15s;
  }
  .btn-sposta:hover  { background: var(--accent-lo); }
  .btn-sposta:active { transform: scale(0.97); }

  .btn-approve { background: var(--green); color: #0a1a12; }
  .btn-reject  { background: var(--red);   color: #1a0a0e; }
  .btn-approve:hover, .btn-reject:hover { opacity: 0.85; }
  .btn-approve:active, .btn-reject:active { transform: scale(0.97); }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 0.85rem;
  }
  .empty .icon { font-size: 2.5rem; margin-bottom: 0.8rem; opacity: 0.4; }

  /* Loading */
  .loading-bar {
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--green), var(--accent));
    background-size: 200%;
    animation: slide 1.5s linear infinite;
    border-radius: 2px;
    margin-bottom: 1rem;
  }
  @keyframes slide { to { background-position: 200% } }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(6rem);
    background: var(--surface);
    border: 1px solid var(--border-hi);
    border-radius: 999px;
    padding: 0.7rem 1.5rem;
    font-family: var(--mono);
    font-size: 0.82rem;
    z-index: 100;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error   { border-color: var(--red);   color: var(--red); }

  /* Link */
  .btn-link {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--accent);
    background: var(--accent-lo);
    border: 1px solid rgba(79,124,255,0.25);
    border-radius: 8px;
    padding: 0.45rem 1rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    transition: background 0.2s;
  }
  .btn-link:hover { background: rgba(79,124,255,0.22); }
  .btn-link.active {
    background: var(--green); color: #0a1a12; border-color: transparent;
  }
  .btn-link.active:hover { background: var(--green); }

  .identita-bar {
    font-size: 0.85rem;
    color: var(--text-dim);
    min-height: 1.2rem;
    align-self: stretch;
    text-align: left;
  }

  .dev-switcher-bar {
    display: none;
    gap: 0.5rem;
    align-items: center;
    padding: 0.5rem 0.9rem;
    margin-bottom: 1.2rem;
    font-size: 0.78rem;
    background: rgba(255,255,255,0.03);
    border: 1px dashed rgba(255,255,255,0.15);
    border-radius: 8px;
  }

  @keyframes fadeDown { from { opacity:0; transform:translateY(-14px) } to { opacity:1; transform:none } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(14px)  } to { opacity:1; transform:none } }

  @media (max-width: 600px) {
    .stats-bar { grid-template-columns: 1fr 1fr; }
    .detail-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="header">
    <div class="header-left">
      <div class="badge">CRaC — Commissione Tempo Telescopio</div>
      <h1>Dashboard <span>Responsabile</span></h1>
    </div>
    <div class="header-right">
      <div id="utente-corrente" class="identita-bar"></div>
      <div class="header-actions">
        <a href="telescope_time_calendario.html" class="btn-link">
          ← Calendario
        </a>
        <a href="telescope_time_request.html" class="btn-link">
          ← Modulo Richiesta
        </a>
        <button class="btn-link" onclick="caricaRichieste()">↻ Aggiorna</button>
      </div>
    </div>
  </div>

  <div id="dev-switcher" class="dev-switcher-bar">
    <span style="color:var(--text-dim)">Modalità sviluppo — provo come:</span>
    <button class="btn-link" id="dev-btn-responsabile" onclick="passaA('responsabile')">responsabile</button>
    <button class="btn-link" id="dev-btn-socio" onclick="passaA('socio')">socio</button>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card attesa">
      <div class="val" id="stat-attesa">–</div>
      <div class="lbl">IN ATTESA</div>
    </div>
    <div class="stat-card approv">
      <div class="val" id="stat-approv">–</div>
      <div class="lbl">APPROVATE</div>
    </div>
    <div class="stat-card rifiut">
      <div class="val" id="stat-rifiut">–</div>
      <div class="lbl">RIFIUTATE</div>
    </div>
  </div>

  <!-- Filtri -->
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="tutte" onclick="setFilter(this)">Tutte</button>
    <button class="filter-btn f-attesa" data-filter="in_attesa" onclick="setFilter(this)">In attesa</button>
    <button class="filter-btn f-approv" data-filter="approvata" onclick="setFilter(this)">Approvate</button>
    <button class="filter-btn f-rifiut" data-filter="rifiutata" onclick="setFilter(this)">Rifiutate</button>
  </div>

  <div id="loading-bar" class="loading-bar" style="display:none"></div>

  <!-- Lista richieste -->
  <div class="list" id="list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = '/telescope-time';

let allRichieste = [];
let currentFilter = 'tutte';
let ricercheMap = {};
// Ricaricata a ogni refresh insieme al resto: chi perde il ruolo di
// responsabile mentre ha la pagina aperta vede sparire i comandi entro il
// prossimo aggiornamento, non solo al prossimo login.
let me = { e_responsabile: false };

// ─── Carica dati ──────────────────────────────────────────────────────────────
async function caricaRichieste() {
  document.getElementById('loading-bar').style.display = 'block';
  try {
    const [riRes, rcRes, meRes] = await Promise.all([
      fetch(`${API_BASE}/richieste`),
      fetch(`${API_BASE}/ricerche`),
      fetch(`${API_BASE}/me`)
    ]);
    allRichieste = await riRes.json();
    const ricerche = await rcRes.json();
    ricercheMap = Object.fromEntries(ricerche.map(r => [r.id, r]));
    me = await meRes.json();
    renderIdentita();

    aggiornaStats();
    renderList();
  } catch(e) {
    showToast('Errore caricamento dati.', 'error');
  } finally {
    document.getElementById('loading-bar').style.display = 'none';
  }
}

function renderIdentita() {
  const visualizzato = me.nome_completo || me.nome;
  document.getElementById('utente-corrente').textContent =
    visualizzato ? `Sei collegato come ${visualizzato}` : '';
  document.getElementById('dev-switcher').style.display = me.modalita_dev ? 'flex' : 'none';
  document.getElementById('dev-btn-responsabile').classList.toggle('active', me.e_responsabile);
  document.getElementById('dev-btn-socio').classList.toggle('active', !me.e_responsabile);
}

// Solo per AUTH_MODE=dev: passa da un utente sintetizzato all'altro senza
// header manuali né riavviare il container (#26).
function passaA(ruolo) {
  document.cookie = `dev_ruolo=${ruolo}; path=/`;
  location.reload();
}

function aggiornaStats() {
  const conteggi = { in_attesa: 0, approvata: 0, rifiutata: 0 };
  allRichieste.forEach(r => {
    if (conteggi[r.stato] !== undefined) conteggi[r.stato]++;
  });
  document.getElementById('stat-attesa').textContent = conteggi.in_attesa;
  document.getElementById('stat-approv').textContent = conteggi.approvata;
  document.getElementById('stat-rifiut').textContent = conteggi.rifiutata;
}

// ─── Filtri ───────────────────────────────────────────────────────────────────
function setFilter(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  renderList();
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderList() {
  // La lista viene riscritta da capo a ogni azione e a ogni auto-refresh: senza
  // questo, la card su cui si sta lavorando si richiude sotto le mani.
  const aperti = dettagliAperti();
  const list = document.getElementById('list');
  const filtered = currentFilter === 'tutte'
    ? allRichieste
    : allRichieste.filter(r => r.stato === currentFilter);

  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><div class="icon">🔭</div>Nessuna richiesta${currentFilter !== 'tutte' ? ' con questo stato' : ''}.</div>`;
    return;
  }

  list.innerHTML = filtered.map(r => {
    const ricerca = ricercheMap[r.ricerca_id] || {};
    // `inizio` è ora locale dell'osservatorio: la parte oraria si legge come
    // stringa, così il fuso del browser non la sposta. La sola data passa da
    // Date perché va scritta per esteso in italiano.
    const data = new Date(r.inizio).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    const dataCreazione = new Date(r.creata_il).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

    // Il comando che riporterebbe allo stato corrente non compare: il server
    // lo tratta già come un non-evento, mostrarlo suggerirebbe un'azione che
    // non fa niente. Una decisione si ribalta, non si ripete.
    const comandi = {
      in_attesa: [['approvata', '✓ Approva'], ['rifiutata', '✗ Rifiuta']],
      approvata: [['rifiutata', '↺ Ribalta: rifiuta']],
      rifiutata: [['approvata', '↺ Ribalta: approva']],
    }[r.stato];
    const statoLabel = { in_attesa: 'IN ATTESA', approvata: 'APPROVATA', rifiutata: 'RIFIUTATA' }[r.stato];

    return `
    <div class="richiesta-card stato-${r.stato}" id="card-${r.id}">
      <div class="rc-header" onclick="toggleDetail(${r.id})">
        <div class="rc-left">
          <div class="rc-nome-ricerca">${escHtml(r.nome_ricerca)}</div>
          <div class="rc-meta">
            <span>👤 ${escHtml(r.osservatore)}</span>
            <span>📅 ${data}</span>
            <span>🔭 ${fascia(r.inizio, r.fine)}</span>
            <span>🕐 ${dataCreazione}</span>
            ${r.co_osservatori ? `<span>👥 ${escHtml(r.co_osservatori)}</span>` : ''}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:0.6rem">
          <span class="stato-badge stato-${r.stato}">${statoLabel}</span>
          <svg id="chevron-${r.id}" width="14" height="14" viewBox="0 0 14 14" fill="none" style="color:var(--text-dim);transition:transform 0.2s">
            <path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <div class="rc-detail" id="detail-${r.id}">
        <div class="detail-grid">
          <div class="detail-item">
            <div class="dl">RICERCA</div>
            <div class="dv">${escHtml(r.nome_ricerca)}</div>
          </div>
          <div class="detail-item">
            <div class="dl">ID RICHIESTA</div>
            <div class="dv" style="font-family:var(--mono)">#${r.id}</div>
          </div>
          ${ricerca.descrizione ? `
          <div class="detail-item" style="grid-column:1/-1">
            <div class="dl">DESCRIZIONE RICERCA</div>
            <div class="descrizione-box">${escHtml(ricerca.descrizione)}</div>
          </div>` : ''}
          ${ricerca.specifiche ? `
          <div class="detail-item" style="grid-column:1/-1">
            <div class="dl">SPECIFICHE TECNICHE</div>
            <div class="descrizione-box">${escHtml(ricerca.specifiche)}</div>
          </div>` : ''}
          ${r.note_responsabile ? `
          <div class="detail-item" style="grid-column:1/-1">
            <div class="dl">NOTE RESPONSABILE</div>
            <div class="dv">${escHtml(r.note_responsabile)}</div>
          </div>` : ''}
        </div>

        <div class="storico-box">
          <div class="dl">STORICO</div>
          <div class="storico" id="storico-${r.id}"></div>
        </div>

        ${!me.e_responsabile ? '' : `
        <div class="action-area">
          <textarea class="note-input" id="note-${r.id}" placeholder="Note (opzionale)…">${escHtml(r.note_responsabile)}</textarea>
          ${comandi.map(([stato, etichetta]) => `
          <button class="${stato === 'approvata' ? 'btn-approve' : 'btn-reject'}"
                  onclick="aggiornaStato(${r.id}, '${stato}', '${r.stato}')">${etichetta}</button>`).join('')}
        </div>

        <div class="sposta-area">
          <div class="sposta-campo">
            <div class="dl">NUOVO INIZIO</div>
            <input class="note-input" type="datetime-local" id="sposta-inizio-${r.id}" value="${r.inizio.slice(0,16)}">
          </div>
          <div class="sposta-campo">
            <div class="dl">NUOVA FINE</div>
            <input class="note-input" type="datetime-local" id="sposta-fine-${r.id}" value="${r.fine.slice(0,16)}">
          </div>
          <input class="note-input" type="text" id="sposta-motivo-${r.id}" placeholder="Motivo dello spostamento…">
          <button class="btn-sposta" onclick="spostaOrario(${r.id})">🕒 Sposta</button>
        </div>
        `}
      </div>
    </div>
    `;
  }).join('');

  aperti.forEach(id => {
    // Una richiesta può essere uscita dal filtro attivo proprio per l'azione
    // appena fatta: in quel caso non c'è più nulla da riaprire.
    if (document.getElementById(`detail-${id}`)) mostraDettaglio(id, true);
  });
}

function toggleDetail(id) {
  const aperto = document.getElementById(`detail-${id}`).classList.contains('open');
  mostraDettaglio(id, !aperto);
}

function mostraDettaglio(id, apri) {
  document.getElementById(`detail-${id}`).classList.toggle('open', apri);
  document.getElementById(`chevron-${id}`).style.transform = apri ? 'rotate(180deg)' : '';
  // Ricaricato a ogni apertura: dopo una decisione o uno spostamento la
  // cronologia è cambiata. Solo per le richieste che si aprono davvero —
  // caricarlo in lista significherebbe una chiamata per riga.
  if (apri) caricaStorico(id);
}

function dettagliAperti() {
  return [...document.querySelectorAll('.rc-detail.open')]
    .map(d => d.id.slice('detail-'.length));
}

async function caricaStorico(id) {
  const box = document.getElementById(`storico-${id}`);
  try {
    const voci = await (await fetch(`${API_BASE}/richieste/${id}/storico`)).json();
    box.innerHTML = voci.length
      ? voci.map(voceStorico).join('')
      : '<div class="vuoto">Nessuna decisione presa finora.</div>';
  } catch(e) {
    box.innerHTML = '<div class="vuoto">Storico non disponibile.</div>';
  }
}

function voceStorico(v) {
  const quando = new Date(v.deciso_il).toLocaleString('it-IT',
    { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const cosa = v.tipo === 'spostamento'
    ? `spostata da ${fascia(v.inizio_precedente, v.fine_precedente)}`
      + ` a ${fascia(v.inizio_nuovo, v.fine_nuovo)}`
    : `${v.stato_precedente} → ${v.stato_nuovo}`;
  return `<div class="voce">
    <span class="quando">${quando}</span>
    <span>${escHtml(cosa)}</span>
    <span class="chi">${escHtml(v.deciso_da || '—')}</span>
    ${v.note ? `<span class="nota">${escHtml(v.note)}</span>` : ''}
  </div>`;
}

// ─── Approva / Rifiuta ────────────────────────────────────────────────────────
async function aggiornaStato(id, stato, statoAttuale) {
  // Il campo si apre già compilato con le note esistenti, quindi il suo
  // contenuto è la volontà dell'utente — stringa vuota compresa. Inviare
  // `null` al posto del vuoto direbbe al server "non toccarle", e svuotarle
  // diventerebbe impossibile.
  const note = document.getElementById(`note-${id}`).value.trim();

  const label = stato === 'approvata' ? 'approvare' : 'rifiutare';
  const deciso = statoAttuale === 'in_attesa'
    ? `Vuoi ${label} questa richiesta?`
    : `Stai annullando una decisione già comunicata all'osservatore, che riceverà`
      + ` una seconda email.\n\nVuoi ${label} questa richiesta?`;
  if (!confirm(deciso)) return;

  try {
    const res = await fetch(`${API_BASE}/richieste/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stato, note_responsabile: note })
    });
    if (res.status === 409) {
      // Sovrapposizione di fascia: il messaggio nomina la richiesta in
      // conflitto, ed è l'unica cosa che dice al responsabile cosa spostare.
      showToast((await res.json()).detail, 'error');
      return;
    }
    if (res.status === 403) {
      // Il comando resta raggiungibile anche a pulsanti nascosti, da chi ha
      // la pagina aperta da prima di un cambio di gruppo.
      showToast('Solo i responsabili possono approvare o rifiutare.', 'error');
      return;
    }
    if (!res.ok) throw new Error();

    const emoji = stato === 'approvata' ? '✓' : '✗';
    showToast(`${emoji} Richiesta ${stato} con successo.`, stato === 'approvata' ? 'success' : 'error');
    await caricaRichieste();

  } catch(e) {
    showToast('Errore durante l\'aggiornamento.', 'error');
  }
}

// `inizio` e `fine` sono ora locale dell'osservatorio: le ore si leggono come
// stringa, così il fuso del browser non le sposta.
function fascia(inizio, fine) {
  return `${inizio.slice(11,16)} → ${fine.slice(11,16)}`
       + (inizio.slice(0,10) === fine.slice(0,10) ? '' : ' (+1g)');
}

// ─── Sposta data e orari ──────────────────────────────────────────────────────
async function spostaOrario(id) {
  const inizio = document.getElementById(`sposta-inizio-${id}`).value;
  const fine   = document.getElementById(`sposta-fine-${id}`).value;
  const motivo = document.getElementById(`sposta-motivo-${id}`).value.trim();

  if (!inizio || !fine) {
    showToast('Indica il nuovo inizio e la nuova fine.', 'error'); return;
  }
  if (fine <= inizio) {
    showToast('La fine deve essere successiva all\'inizio.', 'error'); return;
  }

  // Spostare nel passato è permesso — serve a registrare a posteriori
  // un'osservazione davvero fatta — ma va detto, altrimenti un errore di
  // battitura sull'anno passa in silenzio.
  const conferma = new Date(inizio) < new Date()
    ? 'Stai spostando questa osservazione in una data già trascorsa.\n\nConfermi?'
    : 'Confermi lo spostamento? L\'osservatore riceverà un avviso via email.';
  if (!confirm(conferma)) return;

  try {
    const res = await fetch(`${API_BASE}/richieste/${id}/orario`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ inizio, fine, motivo: motivo || null })
    });

    if (res.status === 409) {
      showToast((await res.json()).detail, 'error'); return;
    }
    if (res.status === 422) {
      showToast('Il server ha rifiutato gli orari: controlla e riprova.', 'error'); return;
    }
    if (res.status === 403) {
      showToast('Solo i responsabili possono spostare una richiesta.', 'error'); return;
    }
    if (!res.ok) throw new Error();

    showToast('🕒 Osservazione riprogrammata, avviso inviato all\'osservatore.', 'success');
    await caricaRichieste();

  } catch(e) {
    showToast('Errore durante lo spostamento.', 'error');
  }
}

// ─── Utility ──────────────────────────────────────────────────────────────────
function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer = null;
function showToast(msg, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 4000);
}

// ─── Auto-refresh ogni 60s ────────────────────────────────────────────────────
caricaRichieste();
setInterval(caricaRichieste, 60000);
</script>
