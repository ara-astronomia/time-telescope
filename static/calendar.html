<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRaC — Calendario Telescopio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:          #0a0c10;
    --surface:     #111318;
    --surface2:    #161920;
    --border:      #1e2230;
    --border-hi:   #2e3450;

    --accent:      #4f7cff;
    --accent-lo:   rgba(79,124,255,0.13);
    --accent-gl:   rgba(79,124,255,0.05);

    --green:       #2dce89;
    --green-lo:    rgba(45,206,137,0.13);
    --green-gl:    rgba(45,206,137,0.05);

    --cyan:        #22d3ee;
    --cyan-lo:     rgba(34,211,238,0.13);
    --cyan-gl:     rgba(34,211,238,0.05);

    --amber:       #ffc107;
    --amber-lo:    rgba(255,193,7,0.13);
    --amber-gl:    rgba(255,193,7,0.05);

    --red:         #ff4d6d;
    --red-lo:      rgba(255,77,109,0.13);

    --text:        #e2e8f0;
    --text-dim:    #64748b;
    --text-mid:    #94a3b8;

    --mono:        'Space Mono', monospace;
    --sans:        'Syne', sans-serif;
    --radius:      10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 2rem 1rem 5rem;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.55) 0%, transparent 100%),
      radial-gradient(1px 1px at 68% 7%,  rgba(255,255,255,0.35) 0%, transparent 100%),
      radial-gradient(1px 1px at 38% 52%, rgba(255,255,255,0.45) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 85% 40%, rgba(255,255,255,0.45) 0%, transparent 100%),
      radial-gradient(1px 1px at 5%  78%, rgba(255,255,255,0.40) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 88%, rgba(255,255,255,0.30) 0%, transparent 100%),
      radial-gradient(1px 1px at 92% 72%, rgba(200,210,255,0.40) 0%, transparent 100%);
    pointer-events: none; z-index: 0;
  }

  .wrapper {
    position: relative; z-index: 1;
    max-width: 1060px; margin: 0 auto;
  }

  /* ── Header ─────────────────────────────────────────────────────────────── */
  .header {
    display: flex; align-items: flex-start;
    justify-content: space-between; flex-wrap: wrap; gap: 1rem;
    margin-bottom: 2rem;
    animation: fadeDown .5s ease both;
  }
  .header-left .badge {
    display: inline-flex; align-items: center; gap: .5rem;
    font-family: var(--mono); font-size: .65rem; letter-spacing: .15em;
    color: var(--accent); background: var(--accent-lo);
    border: 1px solid rgba(79,124,255,.22); border-radius: 999px;
    padding: .25rem .9rem; margin-bottom: .8rem;
  }
  .header-left h1 {
    font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 800;
    letter-spacing: -.02em;
  }
  .header-left h1 span { color: var(--accent); }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.4rem; }
  .header-actions { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }

  .btn-link {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--accent);
    background: var(--accent-lo);
    border: 1px solid rgba(79,124,255,0.25);
    border-radius: 8px;
    padding: 0.45rem 1rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    transition: background 0.2s;
  }
  .btn-link:hover { background: rgba(79,124,255,.22); }
  .btn-link.active {
    background: var(--green); color: #0a1a12; border-color: transparent;
  }
  .btn-link.active:hover { background: var(--green); }

  .user-identity-bar {
    font-size: 0.85rem;
    color: var(--text-dim);
    min-height: 1.2rem;
    align-self: stretch;
    text-align: left;
  }

  .dev-switcher-bar {
    display: none;
    gap: 0.5rem;
    align-items: center;
    padding: 0.5rem 0.9rem;
    margin-bottom: 1.2rem;
    font-size: 0.78rem;
    background: rgba(255,255,255,0.03);
    border: 1px dashed rgba(255,255,255,0.15);
    border-radius: 8px;
  }

  /* ── Month navigation ──────────────────────────────────────────────────── */
  .month-nav {
    display: flex; align-items: center; justify-content: center; gap: 1.2rem;
    margin-bottom: 1.6rem;
    animation: fadeUp .5s ease .1s both;
  }
  .month-nav button {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-mid); border-radius: 8px;
    width: 36px; height: 36px; font-size: 1rem; cursor: pointer;
    transition: border-color .2s, color .2s;
    display: flex; align-items: center; justify-content: center;
  }
  .month-nav button:hover { border-color: var(--border-hi); color: var(--text); }
  .month-title {
    font-size: 1.3rem; font-weight: 800; letter-spacing: -.01em;
    min-width: 220px; text-align: center; font-family: var(--mono);
    text-transform: uppercase;
  }

  /* ── Legend ─────────────────────────────────────────────────────────────── */
  .legend {
    display: flex; gap: 1.2rem; flex-wrap: wrap;
    justify-content: center; margin-bottom: 1.4rem;
    animation: fadeUp .5s ease .12s both;
  }
  .leg-item {
    display: flex; align-items: center; gap: .4rem;
    font-family: var(--mono); font-size: .68rem; color: var(--text-mid);
  }
  .leg-dot {
    width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0;
  }
  .leg-dot.free      { background: var(--border-hi); }
  .leg-dot.pending   { background: var(--cyan); }
  .leg-dot.contested { background: var(--amber); }
  .leg-dot.booked    { background: var(--red); }
  .leg-dot.approv   { background: var(--green); }

  /* ── Calendar grid ──────────────────────────────────────────────────────── */
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: .5rem;
    animation: fadeUp .5s ease .18s both;
  }

  .day-header {
    text-align: center;
    font-family: var(--mono); font-size: .62rem;
    letter-spacing: .1em; color: var(--text-dim);
    padding: .4rem 0;
    text-transform: uppercase;
  }

  .day-cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    min-height: 86px;
    padding: .5rem;
    position: relative;
    cursor: default;
    transition: border-color .2s, transform .15s;
    overflow: hidden;
  }
  .day-cell.other-month { opacity: .25; pointer-events: none; }
  .day-cell.today { border-color: var(--accent) !important; }
  .day-cell.today .day-num::after {
    content: ''; position: absolute; inset: 0;
    background: var(--accent); border-radius: 50%; z-index: -1;
  }

  .day-cell.booked {
    background: rgba(255,77,109,.07);
    border-color: rgba(255,77,109,.3);
    cursor: pointer;
  }
  .day-cell.pending {
    background: var(--cyan-gl);
    border-color: rgba(34,211,238,.28);
    cursor: pointer;
  }
  .day-cell.contested {
    background: rgba(255,193,7,.06);
    border-color: rgba(255,193,7,.28);
    cursor: pointer;
  }
  .day-cell.has-requests { cursor: pointer; }
  .day-cell.has-requests:hover,
  .day-cell.booked:hover,
  .day-cell.pending:hover,
  .day-cell.contested:hover {
    border-color: var(--border-hi);
    transform: translateY(-2px);
    z-index: 2;
  }

  .day-num {
    font-family: var(--mono); font-size: .78rem; font-weight: 700;
    color: var(--text-mid); position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; z-index: 1;
  }
  .day-cell.today .day-num { color: #fff; }

  .day-pills { margin-top: .35rem; display: flex; flex-direction: column; gap: .22rem; }
  .multi-program-badge {
    margin-top: .3rem; padding: .1rem .3rem; border-radius: 4px;
    font-size: .62rem; font-weight: 600; letter-spacing: .02em;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25);
    display: inline-block;
  }
  .pill {
    font-family: var(--mono); font-size: .58rem;
    border-radius: 4px; padding: .12rem .38rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%;
  }
  .pill.approved { background: var(--green-lo); color: var(--green); }
  .pill.pending  { background: var(--amber-lo); color: var(--amber); }
  .pill.more {
    background: var(--surface2); color: var(--text-dim);
    text-align: center;
  }

  /* ── Detail panel ───────────────────────────────────────────────────────── */
  .detail-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    backdrop-filter: blur(4px); z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 1rem;
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .detail-overlay.open { opacity: 1; pointer-events: all; }

  .detail-panel {
    background: var(--surface);
    border: 1px solid var(--border-hi);
    border-radius: 16px;
    width: 100%; max-width: 520px;
    max-height: 80vh; overflow-y: auto;
    padding: 1.6rem;
    transform: translateY(20px);
    transition: transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .detail-overlay.open .detail-panel { transform: none; }

  .dp-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.2rem;
  }
  .dp-date {
    font-family: var(--mono); font-size: .95rem; font-weight: 700;
    letter-spacing: .04em;
  }
  .dp-status {
    font-family: var(--mono); font-size: .65rem; letter-spacing: .1em;
    padding: .25rem .8rem; border-radius: 999px; font-weight: 700;
  }
  .dp-status.booked    { background: var(--red-lo);   color: var(--red);   border: 1px solid rgba(255,77,109,.25); }
  .dp-status.contested { background: var(--amber-lo); color: var(--amber); border: 1px solid rgba(255,193,7,.25); }
  .dp-status.pending   { background: var(--cyan-lo);  color: var(--cyan);  border: 1px solid rgba(34,211,238,.25); }

  .dp-conflict {
    margin-top: .5rem; font-family: var(--mono); font-size: .68rem;
    color: var(--amber);
  }

  .dp-close {
    background: none; border: none; color: var(--text-dim);
    font-size: 1.4rem; cursor: pointer; line-height: 1;
    padding: .2rem .4rem; border-radius: 6px;
    transition: color .15s, background .15s;
  }
  .dp-close:hover { color: var(--text); background: var(--border); }

  .dp-request {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: .8rem;
  }
  .dp-request:last-child { margin-bottom: 0; }

  .dp-r-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: .6rem; flex-wrap: wrap; gap: .4rem;
  }
  .dp-r-program { font-weight: 700; font-size: .95rem; }
  .dp-status-small {
    font-family: var(--mono); font-size: .6rem; letter-spacing: .08em;
    padding: .18rem .65rem; border-radius: 999px; font-weight: 700;
  }
  .dp-status-small.approved { background: var(--green-lo); color: var(--green); border: 1px solid rgba(45,206,137,.25); }
  .dp-status-small.pending  { background: var(--amber-lo); color: var(--amber); border: 1px solid rgba(255,193,7,.25); }

  .dp-r-meta {
    font-family: var(--mono); font-size: .71rem; color: var(--text-mid);
    display: flex; flex-direction: column; gap: .25rem;
  }
  .dp-r-meta span { display: flex; gap: .4rem; align-items: flex-start; }
  .dp-r-meta .lk { color: var(--text-dim); min-width: 90px; flex-shrink: 0; }

  .dp-r-description {
    margin-top: .7rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: .6rem .8rem;
    font-family: var(--mono); font-size: .72rem;
    color: var(--text-mid); line-height: 1.6;
    white-space: pre-wrap;
  }

  /* ── Loading bar ─────────────────────────────────────────────────────────── */
  .loading-bar {
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--green), var(--accent));
    background-size: 200%;
    animation: slide 1.5s linear infinite;
    border-radius: 2px; margin-bottom: 1rem;
  }
  @keyframes slide { to { background-position: 200% } }

  /* ── Animations ──────────────────────────────────────────────────────────── */
  @keyframes fadeDown { from { opacity:0; transform:translateY(-14px) } to { opacity:1; transform:none } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(14px)  } to { opacity:1; transform:none } }

  /* ── Responsive ──────────────────────────────────────────────────────────── */
  @media (max-width: 640px) {
    .cal-grid { gap: .3rem; }
    .day-cell { min-height: 60px; padding: .35rem; }
    .day-num  { font-size: .7rem; }
    .pill     { font-size: .52rem; }
    .month-title { font-size: 1rem; min-width: 160px; }
  }
</style>
</head>
<body>

<div class="wrapper">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="badge">CRaC — Osservatorio</div>
      <h1>Calendario <span>Sessioni</span></h1>
    </div>
    <div class="header-right">
      <div id="current-user" class="user-identity-bar"></div>
      <div class="header-actions">
        <a href="request.html"   class="btn-link">+ Nuova Richiesta</a>
        <a href="dashboard.html" class="btn-link">⊞ Dashboard</a>
      </div>
    </div>
  </div>

  <div id="dev-switcher" class="dev-switcher-bar">
    <span style="color:var(--text-dim)">Modalità sviluppo — provo come:</span>
    <button class="btn-link" id="dev-btn-reviewer" onclick="switchDevRole('responsabile')">responsabile</button>
    <button class="btn-link" id="dev-btn-member" onclick="switchDevRole('socio')">socio</button>
  </div>

  <!-- Month navigation -->
  <div class="month-nav">
    <button onclick="changeMonth(-1)" title="Mese precedente">‹</button>
    <div class="month-title" id="month-title">—</div>
    <button onclick="changeMonth(+1)" title="Mese successivo">›</button>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="leg-item"><div class="leg-dot free"></div>Libera</div>
    <div class="leg-item"><div class="leg-dot pending"></div>Richiesta (in attesa)</div>
    <div class="leg-item"><div class="leg-dot contested"></div>Contesa (fasce sovrapposte)</div>
    <div class="leg-item"><div class="leg-dot booked"></div>Bloccata (approvata)</div>
    <div class="leg-item"><div class="leg-dot approv"></div>Sessione approvata</div>
  </div>

  <div id="loading-bar" class="loading-bar" style="display:none"></div>

  <!-- Calendar grid -->
  <div class="cal-grid" id="cal-grid"></div>

</div><!-- /wrapper -->

<!-- Day detail panel -->
<div class="detail-overlay" id="overlay" onclick="closeOverlay(event)">
  <div class="detail-panel" id="detail-panel">
    <div class="dp-header">
      <div>
        <div class="dp-date" id="dp-date">—</div>
      </div>
      <div style="display:flex;align-items:center;gap:.6rem">
        <span class="dp-status" id="dp-status"></span>
        <button class="dp-close" onclick="closeDetail()">×</button>
      </div>
    </div>
    <div id="dp-content"></div>
  </div>
</div>

<script>
const API_BASE = '/telescope-time';

const MONTH_NAMES_IT = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                 'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const DAY_NAMES_IT  = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];

function humanMonth(date) {
  return date.getMonth() + 1;
}

let today = new Date();
let currentYear = today.getFullYear();
let currentMonth = humanMonth(today);

// nightsByDate: { "YYYY-MM-DD": { night_status, approved_count, pending_count, overlaps[], requests[] } }
let nightsByDate = {};

// ─── Navigation ─────────────────────────────────────────────────────────────
function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  if (currentMonth < 1)  { currentMonth = 12; currentYear--; }
  loadMonth();
}

// ─── Identity ─────────────────────────────────────────────────────────────────
async function loadUser() {
  try {
    const me = await (await fetch(`${API_BASE}/me`)).json();
    const displayName = me.full_name || me.username;
    document.getElementById('current-user').textContent =
      displayName ? `Sei collegato come ${displayName}` : '';
    document.getElementById('dev-switcher').style.display = me.is_dev_mode ? 'flex' : 'none';
    document.getElementById('dev-btn-reviewer').classList.toggle('active', me.is_reviewer);
    document.getElementById('dev-btn-member').classList.toggle('active', !me.is_reviewer);
  } catch(e) {
    document.getElementById('current-user').textContent = 'identità non disponibile';
  }
}

function switchDevRole(role) {
  document.cookie = `dev_role=${role}; path=/`;
  location.reload();
}

// ─── Data fetch ───────────────────────────────────────────────────────────────
async function loadMonth() {
  document.getElementById('loading-bar').style.display = 'block';
  document.getElementById('month-title').textContent =
    `${MONTH_NAMES_IT[currentMonth-1]} ${currentYear}`;

  try {
    const res = await fetch(`${API_BASE}/calendar?year=${currentYear}&month=${currentMonth}`);
    const data = await res.json();
    nightsByDate = data.nights || {};
    renderCalendar();
  } catch(e) {
    console.error('Errore caricamento calendario:', e);
  } finally {
    document.getElementById('loading-bar').style.display = 'none';
  }
}

function mondayOffset(firstDayOfMonth) {
  return (firstDayOfMonth.getDay() + 6) % 7;
}

// The 'booked' color alone doesn't tell a night with one program apart from
// one with three: above 1 approval, the count shows up explicitly in a badge.
function multiProgramBadge(approvedCount) {
  if (approvedCount <= 1) return '';
  return `<div class="multi-program-badge" title="${approvedCount} osservazioni approvate per questa notte">${approvedCount} programmi</div>`;
}

// ─── Grid render ───────────────────────────────────────────────────────────
function renderCalendar() {
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  const mondayFirstOrder = [1,2,3,4,5,6,0];
  mondayFirstOrder.forEach(d => {
    const h = document.createElement('div');
    h.className = 'day-header';
    h.textContent = DAY_NAMES_IT[d];
    grid.appendChild(h);
  });

  const offset = mondayOffset(new Date(currentYear, currentMonth - 1, 1));

  const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
  const totalCells = Math.ceil((offset + daysInMonth) / 7) * 7;

  const todayStr = fmtDate(today.getFullYear(), humanMonth(today), today.getDate());

  for (let i = 0; i < totalCells; i++) {
    const day = i - offset + 1;
    const cell = document.createElement('div');

    if (day < 1 || day > daysInMonth) {
      cell.className = 'day-cell other-month';
      const ghostDate = day < 1
        ? new Date(currentYear, currentMonth-1, day)
        : new Date(currentYear, currentMonth-1, day);
      cell.innerHTML = `<div class="day-num">${ghostDate.getDate ? ghostDate.getDate() : ''}</div>`;
      grid.appendChild(cell);
      continue;
    }

    const dateStr = fmtDate(currentYear, currentMonth, day);
    const info = nightsByDate[dateStr];
    const status = info ? info.night_status : 'free';
    const requests = info ? info.requests : [];

    cell.className = `day-cell ${status}${requests.length ? ' has-requests' : ''}`;
    cell.dataset.date = dateStr;
    if (dateStr === todayStr) cell.classList.add('today');

    let html = `<div class="day-num">${day}</div>`;

    const approvedCount = info ? (info.approved_count || 0) : 0;
    html += multiProgramBadge(approvedCount);

    if (requests.length) {
      html += '<div class="day-pills">';
      const visibleMax3 = requests.slice(0, 3);
      visibleMax3.forEach(r => {
        const firstName = escHtml(r.observer.split(' ')[0]);
        html += `<div class="pill ${r.status}">${formatTime(r.start)} ${firstName} · ${escHtml(r.research_program_name)}</div>`;
      });
      if (requests.length > 3) {
        html += `<div class="pill more">+${requests.length - 3} altre</div>`;
      }
      html += '</div>';
    }

    cell.innerHTML = html;

    if (requests.length) {
      cell.addEventListener('click', () => openDetail(dateStr, status, info));
    }

    grid.appendChild(cell);
  }
}

// ─── Day detail ─────────────────────────────────────────────────────────
// `instant` is observatory local time: it must be read as a string, not
// passed to Date, or the browser's timezone would shift it.
function formatTime(instant) {
  return instant.slice(11, 16);
}

function timeRange(r) {
  const sameNight = r.start.slice(0, 10) === r.end.slice(0, 10);
  return `${formatTime(r.start)} → ${formatTime(r.end)}${sameNight ? '' : ' (+1g)'}`;
}

function openDetail(dateStr, status, info) {
  const requests = info.requests;
  // Per richiesta, gli id delle richieste con cui è in conflitto: al
  // responsabile non basta sapere che c'è una sovrapposizione, deve sapere
  // con chi per decidere cosa spostare.
  const conflictingRequestsById = {};
  (info.overlaps || []).forEach(([a, b]) => {
    (conflictingRequestsById[a] = conflictingRequestsById[a] || []).push(b);
    (conflictingRequestsById[b] = conflictingRequestsById[b] || []).push(a);
  });

  const [y, m, d] = dateStr.split('-');
  const dateLabel = `${parseInt(d)} ${MONTH_NAMES_IT[parseInt(m)-1]} ${y}`;

  document.getElementById('dp-date').textContent = dateLabel;

  const statusEl = document.getElementById('dp-status');
  const statusLabels = { booked: 'BLOCCATA', contested: 'CONTESA', pending: 'RICHIESTA', free: '' };
  statusEl.textContent = statusLabels[status] || '';
  statusEl.className = `dp-status ${status}`;

  const sortedRequests = [...requests].sort((a, b) => {
    if (a.status === 'approved' && b.status !== 'approved') return -1;
    if (b.status === 'approved' && a.status !== 'approved') return 1;
    return 0;
  });

  document.getElementById('dp-content').innerHTML = sortedRequests.map(r => `
    <div class="dp-request">
      <div class="dp-r-top">
        <div class="dp-r-program">${escHtml(r.research_program_name)}</div>
        <span class="dp-status-small ${r.status}">${r.status === 'approved' ? 'APPROVATA' : 'IN ATTESA'}</span>
      </div>
      <div class="dp-r-meta">
        <span><span class="lk">Fascia</span>${timeRange(r)}</span>
        <span><span class="lk">Osservatore</span>${escHtml(r.observer)}</span>
        ${r.co_observers ? `<span><span class="lk">Co-osservatori</span>${escHtml(r.co_observers)}</span>` : ''}
        ${r.reviewer_notes ? `<span><span class="lk">Note</span>${escHtml(r.reviewer_notes)}</span>` : ''}
      </div>
      ${r.description ? `<div class="dp-r-description">${escHtml(r.description)}</div>` : ''}
      ${conflictingRequestsById[r.id] ? `<div class="dp-conflict">⚠ Si sovrappone a ${conflictingRequestsById[r.id].map(id => '#' + id).join(', ')}</div>` : ''}
    </div>
  `).join('');

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeOverlay(e) {
  if (e.target === document.getElementById('overlay')) closeDetail();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
});

// ─── Utility ──────────────────────────────────────────────────────────────────
function fmtDate(y, m, d) {
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Init ─────────────────────────────────────────────────────────────────────
loadUser();
loadMonth();
</script>
