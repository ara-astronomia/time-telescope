<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRaC — Dashboard Tempo Telescopio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0a0c10;
    --surface:   #111318;
    --surface2:  #161920;
    --border:    #1e2230;
    --border-hi: #2e3450;
    --accent:    #4f7cff;
    --accent-lo: rgba(79,124,255,0.12);
    --green:     #2dce89;
    --green-lo:  rgba(45,206,137,0.12);
    --red:       #ff4d6d;
    --red-lo:    rgba(255,77,109,0.12);
    --amber:     #ffc107;
    --amber-lo:  rgba(255,193,7,0.10);
    --text:      #e2e8f0;
    --text-dim:  #64748b;
    --text-mid:  #94a3b8;
    --mono:      'Space Mono', monospace;
    --sans:      'Syne', sans-serif;
    --radius:    10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 15%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 10%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 45%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 8%  85%, rgba(255,255,255,0.5) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 1000px;
    margin: 0 auto;
  }

  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 2rem;
    animation: fadeDown 0.5s ease both;
  }
  .header-left .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--amber);
    background: var(--amber-lo);
    border: 1px solid rgba(255,193,7,0.2);
    border-radius: 999px;
    padding: 0.25rem 0.9rem;
    margin-bottom: 0.8rem;
  }
  .header-left h1 {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .header-left h1 span { color: var(--amber); }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.4rem; }
  .header-actions { display: flex; gap: 0.6rem; align-items: center; }

  .stats-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.8rem;
    margin-bottom: 1.8rem;
    animation: fadeUp 0.5s ease 0.1s both;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }
  .stat-card .val {
    font-size: 1.8rem;
    font-weight: 800;
    font-family: var(--mono);
    line-height: 1;
  }
  .stat-card .lbl {
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    font-family: var(--mono);
  }
  .stat-card.pending  .val { color: var(--amber); }
  .stat-card.approved .val { color: var(--green); }
  .stat-card.rejected .val { color: var(--red); }

  .filter-bar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.4rem;
    flex-wrap: wrap;
    animation: fadeUp 0.5s ease 0.15s both;
  }
  .filter-btn {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    padding: 0.4rem 1rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--border-hi); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filter-btn.active.f-pending  { background: var(--amber); border-color: var(--amber); }
  .filter-btn.active.f-approved { background: var(--green); border-color: var(--green); }
  .filter-btn.active.f-rejected { background: var(--red);   border-color: var(--red); }

  .list { animation: fadeUp 0.5s ease 0.2s both; }

  .request-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 0.9rem;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .request-card:hover { border-color: var(--border-hi); }

  .request-card.status-pending  { border-left: 3px solid var(--amber); }
  .request-card.status-approved { border-left: 3px solid var(--green); }
  .request-card.status-rejected { border-left: 3px solid var(--red);   }

  .rc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.8rem;
    padding: 1rem 1.2rem;
    cursor: pointer;
    user-select: none;
  }
  .rc-header:hover { background: rgba(255,255,255,0.02); }

  .rc-left { display: flex; flex-direction: column; gap: 0.3rem; }
  .rc-program-name {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }
  .rc-meta {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text-mid);
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .rc-meta span { display: flex; align-items: center; gap: 0.35rem; }

  .status-badge {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    padding: 0.25rem 0.8rem;
    border-radius: 999px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .status-pending  { background: var(--amber-lo); color: var(--amber); border: 1px solid rgba(255,193,7,0.25); }
  .status-approved { background: var(--green-lo); color: var(--green); border: 1px solid rgba(45,206,137,0.25); }
  .status-rejected { background: var(--red-lo);   color: var(--red);   border: 1px solid rgba(255,77,109,0.25); }

  .rc-detail {
    display: none;
    padding: 0 1.2rem 1.2rem;
    border-top: 1px solid var(--border);
    animation: fadeUp 0.25s ease both;
  }
  .rc-detail.open { display: block; }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.8rem;
    margin: 1rem 0;
  }
  .detail-item {}
  .detail-item .dl { font-family: var(--mono); font-size: 0.65rem; color: var(--text-dim); letter-spacing: 0.1em; margin-bottom: 0.2rem; }
  .detail-item .dv { font-size: 0.9rem; color: var(--text); }

  .description-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.8rem;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--text-mid);
    margin-bottom: 1rem;
    white-space: pre-wrap;
    line-height: 1.6;
  }

  .action-area {
    display: flex;
    gap: 0.6rem;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .note-input {
    flex: 1;
    min-width: 200px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.82rem;
    padding: 0.5rem 0.8rem;
    outline: none;
    transition: border-color 0.2s;
    resize: none;
    height: 38px;
  }
  .note-input:focus { border-color: var(--accent); }

  .btn-approve, .btn-reject {
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    padding: 0.5rem 1.1rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 700;
    transition: opacity 0.2s, transform 0.15s;
    height: 38px;
  }
  .history-box {
    margin-top: 0.8rem; padding-top: 0.8rem;
    border-top: 1px solid var(--border);
  }
  .history { font-family: var(--mono); font-size: 0.72rem; margin-top: 0.4rem; }
  .history .entry {
    display: flex; gap: 0.6rem; flex-wrap: wrap;
    padding: 0.3rem 0; color: var(--text-mid);
  }
  .history .when  { color: var(--text-dim); min-width: 130px; }
  .history .who   { color: var(--accent); }
  .history .note  { color: var(--text-dim); font-style: italic; }
  .history .empty-state { color: var(--text-dim); padding: 0.3rem 0; }

  .reschedule-area {
    display: flex; gap: 0.6rem; align-items: flex-end; flex-wrap: wrap;
    margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px solid var(--border);
  }
  .reschedule-field { display: flex; flex-direction: column; gap: 0.25rem; }
  .reschedule-field .dl { font-size: 0.62rem; }
  .reschedule-field input { min-width: 190px; }

  .btn-reschedule {
    font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.05em;
    padding: 0.5rem 1.1rem; border-radius: 8px; cursor: pointer;
    font-weight: 700; height: 38px;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent);
    transition: background 0.2s, transform 0.15s;
  }
  .btn-reschedule:hover  { background: var(--accent-lo); }
  .btn-reschedule:active { transform: scale(0.97); }

  .btn-approve { background: var(--green); color: #0a1a12; }
  .btn-reject  { background: var(--red);   color: #1a0a0e; }
  .btn-approve:hover, .btn-reject:hover { opacity: 0.85; }
  .btn-approve:active, .btn-reject:active { transform: scale(0.97); }

  .empty {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 0.85rem;
  }
  .empty .icon { font-size: 2.5rem; margin-bottom: 0.8rem; opacity: 0.4; }

  .loading-bar {
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--green), var(--accent));
    background-size: 200%;
    animation: slide 1.5s linear infinite;
    border-radius: 2px;
    margin-bottom: 1rem;
  }
  @keyframes slide { to { background-position: 200% } }

  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(6rem);
    background: var(--surface);
    border: 1px solid var(--border-hi);
    border-radius: 999px;
    padding: 0.7rem 1.5rem;
    font-family: var(--mono);
    font-size: 0.82rem;
    z-index: 100;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error   { border-color: var(--red);   color: var(--red); }

  .btn-link {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--accent);
    background: var(--accent-lo);
    border: 1px solid rgba(79,124,255,0.25);
    border-radius: 8px;
    padding: 0.45rem 1rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    transition: background 0.2s;
  }
  .btn-link:hover { background: rgba(79,124,255,0.22); }
  .btn-link.active {
    background: var(--green); color: #0a1a12; border-color: transparent;
  }
  .btn-link.active:hover { background: var(--green); }

  .identity-bar {
    font-size: 0.85rem;
    color: var(--text-dim);
    min-height: 1.2rem;
    align-self: stretch;
    text-align: left;
  }

  .dev-switcher-bar {
    display: none;
    gap: 0.5rem;
    align-items: center;
    padding: 0.5rem 0.9rem;
    margin-bottom: 1.2rem;
    font-size: 0.78rem;
    background: rgba(255,255,255,0.03);
    border: 1px dashed rgba(255,255,255,0.15);
    border-radius: 8px;
  }

  @keyframes fadeDown { from { opacity:0; transform:translateY(-14px) } to { opacity:1; transform:none } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(14px)  } to { opacity:1; transform:none } }

  @media (max-width: 600px) {
    .stats-bar { grid-template-columns: 1fr 1fr; }
    .detail-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="header">
    <div class="header-left">
      <div class="badge">CRaC — Commissione Tempo Telescopio</div>
      <h1>Dashboard <span>Responsabile</span></h1>
    </div>
    <div class="header-right">
      <div id="current-user" class="identity-bar"></div>
      <div class="header-actions">
        <a href="calendar.html" class="btn-link">
          ← Calendario
        </a>
        <a href="request.html" class="btn-link">
          ← Modulo Richiesta
        </a>
        <button class="btn-link" onclick="loadRequests()">↻ Aggiorna</button>
      </div>
    </div>
  </div>

  <div id="dev-switcher" class="dev-switcher-bar">
    <span style="color:var(--text-dim)">Modalità sviluppo — provo come:</span>
    <button class="btn-link" id="dev-btn-reviewer" onclick="switchDevRole('responsabile')">responsabile</button>
    <button class="btn-link" id="dev-btn-member" onclick="switchDevRole('socio')">socio</button>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card pending">
      <div class="val" id="stat-pending">–</div>
      <div class="lbl">IN ATTESA</div>
    </div>
    <div class="stat-card approved">
      <div class="val" id="stat-approved">–</div>
      <div class="lbl">APPROVATE</div>
    </div>
    <div class="stat-card rejected">
      <div class="val" id="stat-rejected">–</div>
      <div class="lbl">RIFIUTATE</div>
    </div>
  </div>

  <!-- Filtri -->
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all" onclick="setFilter(this)">Tutte</button>
    <button class="filter-btn f-pending" data-filter="pending" onclick="setFilter(this)">In attesa</button>
    <button class="filter-btn f-approved" data-filter="approved" onclick="setFilter(this)">Approvate</button>
    <button class="filter-btn f-rejected" data-filter="rejected" onclick="setFilter(this)">Rifiutate</button>
  </div>

  <div id="loading-bar" class="loading-bar" style="display:none"></div>

  <!-- Lista richieste -->
  <div class="list" id="list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = '/telescope-time';

let allRequests = [];
let currentFilter = 'all';
let researchProgramsMap = {};
let me = { is_reviewer: false };

// ─── Load data ─────────────────────────────────────────────────────────────
async function loadRequests() {
  document.getElementById('loading-bar').style.display = 'block';
  try {
    const [requestsRes, programsRes, meRes] = await Promise.all([
      fetch(`${API_BASE}/requests`),
      fetch(`${API_BASE}/research-programs`),
      fetch(`${API_BASE}/me`)
    ]);
    allRequests = await requestsRes.json();
    const researchPrograms = await programsRes.json();
    researchProgramsMap = Object.fromEntries(researchPrograms.map(r => [r.id, r]));
    me = await meRes.json();
    renderIdentity();

    updateStats();
    renderList();
  } catch(e) {
    showToast('Errore caricamento dati.', 'error');
  } finally {
    document.getElementById('loading-bar').style.display = 'none';
  }
}

function renderIdentity() {
  const displayName = me.full_name || me.username;
  document.getElementById('current-user').textContent =
    displayName ? `Sei collegato come ${displayName}` : '';
  document.getElementById('dev-switcher').style.display = me.is_dev_mode ? 'flex' : 'none';
  document.getElementById('dev-btn-reviewer').classList.toggle('active', me.is_reviewer);
  document.getElementById('dev-btn-member').classList.toggle('active', !me.is_reviewer);
}

function switchDevRole(role) {
  document.cookie = `dev_role=${role}; path=/`;
  location.reload();
}

function updateStats() {
  const counts = { pending: 0, approved: 0, rejected: 0 };
  allRequests.forEach(r => {
    if (counts[r.status] !== undefined) counts[r.status]++;
  });
  document.getElementById('stat-pending').textContent = counts.pending;
  document.getElementById('stat-approved').textContent = counts.approved;
  document.getElementById('stat-rejected').textContent = counts.rejected;
}

// ─── Filters ───────────────────────────────────────────────────────────────
function setFilter(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  renderList();
}

function longItalianDate(start) {
  return new Date(start).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

// ─── Render ────────────────────────────────────────────────────────────────
function renderList() {
  const idsToReopenAfterRender = openDetailIds();
  const list = document.getElementById('list');
  const filtered = currentFilter === 'all'
    ? allRequests
    : allRequests.filter(r => r.status === currentFilter);

  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><div class="icon">🔭</div>Nessuna richiesta${currentFilter !== 'all' ? ' con questo stato' : ''}.</div>`;
    return;
  }

  list.innerHTML = filtered.map(r => {
    const researchProgram = researchProgramsMap[r.research_program_id] || {};
    const formattedDate = longItalianDate(r.start);
    const createdLabel = new Date(r.created_at).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

    // No command leads back to the current status: the server would treat
    // it as a non-event, and showing it would suggest an action that does nothing.
    const actions = {
      pending:  [['approved', '✓ Approva'], ['rejected', '✗ Rifiuta']],
      approved: [['rejected', '↺ Ribalta: rifiuta']],
      rejected: [['approved', '↺ Ribalta: approva']],
    }[r.status];
    const statusLabel = { pending: 'IN ATTESA', approved: 'APPROVATA', rejected: 'RIFIUTATA' }[r.status];
    const canReschedule = me.is_reviewer || (r.requester_id === me.id && r.status === 'pending');

    return `
    <div class="request-card status-${r.status}" id="card-${r.id}">
      <div class="rc-header" onclick="toggleDetail(${r.id})">
        <div class="rc-left">
          <div class="rc-program-name">${escHtml(r.research_program_name)}</div>
          <div class="rc-meta">
            <span>👤 ${escHtml(r.observer)}</span>
            <span>📅 ${formattedDate}</span>
            <span>🔭 ${timeRange(r.start, r.end)}</span>
            <span>🕐 ${createdLabel}</span>
            ${r.co_observers ? `<span>👥 ${escHtml(r.co_observers)}</span>` : ''}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:0.6rem">
          <span class="status-badge status-${r.status}">${statusLabel}</span>
          <svg id="chevron-${r.id}" width="14" height="14" viewBox="0 0 14 14" fill="none" style="color:var(--text-dim);transition:transform 0.2s">
            <path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <div class="rc-detail" id="detail-${r.id}">
        <div class="detail-grid">
          <div class="detail-item">
            <div class="dl">RICERCA</div>
            <div class="dv">${escHtml(r.research_program_name)}</div>
          </div>
          <div class="detail-item">
            <div class="dl">ID RICHIESTA</div>
            <div class="dv" style="font-family:var(--mono)">#${r.id}</div>
          </div>
          ${researchProgram.description ? `
          <div class="detail-item" style="grid-column:1/-1">
            <div class="dl">DESCRIZIONE RICERCA</div>
            <div class="description-box">${escHtml(researchProgram.description)}</div>
          </div>` : ''}
          ${researchProgram.specs ? `
          <div class="detail-item" style="grid-column:1/-1">
            <div class="dl">SPECIFICHE TECNICHE</div>
            <div class="description-box">${escHtml(researchProgram.specs)}</div>
          </div>` : ''}
          ${r.reviewer_notes ? `
          <div class="detail-item" style="grid-column:1/-1">
            <div class="dl">NOTE RESPONSABILE</div>
            <div class="dv">${escHtml(r.reviewer_notes)}</div>
          </div>` : ''}
        </div>

        <div class="history-box">
          <div class="dl">STORICO</div>
          <div class="history" id="history-${r.id}"></div>
        </div>

        ${!me.is_reviewer ? '' : `
        <div class="action-area">
          <textarea class="note-input" id="notes-${r.id}" placeholder="Note (opzionale)…">${escHtml(r.reviewer_notes)}</textarea>
          ${actions.map(([status, label]) => `
          <button class="${status === 'approved' ? 'btn-approve' : 'btn-reject'}"
                  onclick="updateStatus(${r.id}, '${status}', '${r.status}')">${label}</button>`).join('')}
        </div>
        `}

        ${!canReschedule ? '' : `
        <div class="reschedule-area">
          <div class="reschedule-field">
            <div class="dl">NUOVO INIZIO</div>
            <input class="note-input" type="datetime-local" id="reschedule-start-${r.id}" value="${r.start.slice(0,16)}"
                   oninput="updateRescheduleMax(${r.id})">
          </div>
          <div class="reschedule-field">
            <div class="dl">NUOVA FINE</div>
            <input class="note-input" type="datetime-local" id="reschedule-end-${r.id}" value="${r.end.slice(0,16)}"
                   max="${nightWindowEnd(r.start)}">
          </div>
          <input class="note-input" type="text" id="reschedule-reason-${r.id}" placeholder="Motivo dello spostamento…">
          <button class="btn-reschedule" onclick="rescheduleRequest(${r.id})">🕒 Sposta</button>
        </div>
        `}
      </div>
    </div>
    `;
  }).join('');

  idsToReopenAfterRender
    .filter(id => document.getElementById(`detail-${id}`))
    .forEach(id => showDetail(id, true));
}

function toggleDetail(id) {
  const isOpen = document.getElementById(`detail-${id}`).classList.contains('open');
  showDetail(id, !isOpen);
}

function showDetail(id, open) {
  document.getElementById(`detail-${id}`).classList.toggle('open', open);
  document.getElementById(`chevron-${id}`).style.transform = open ? 'rotate(180deg)' : '';
  // Reloaded on every open: after a decision or a reschedule the history
  // has changed. Only for requests that actually get opened — loading it
  // for every row in the list would mean one call per row.
  if (open) loadHistory(id);
}

function openDetailIds() {
  return [...document.querySelectorAll('.rc-detail.open')]
    .map(d => d.id.slice('detail-'.length));
}

async function loadHistory(id) {
  const box = document.getElementById(`history-${id}`);
  try {
    const entries = await (await fetch(`${API_BASE}/requests/${id}/history`)).json();
    box.innerHTML = entries.length
      ? entries.map(historyEntry).join('')
      : '<div class="empty-state">Nessuna decisione presa finora.</div>';
  } catch(e) {
    box.innerHTML = '<div class="empty-state">Storico non disponibile.</div>';
  }
}

function historyEntry(v) {
  const when = new Date(v.decided_at).toLocaleString('it-IT',
    { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const what = v.type === 'reschedule'
    ? `spostata da ${timeRange(v.previous_start, v.previous_end)}`
      + ` a ${timeRange(v.new_start, v.new_end)}`
    : `${v.previous_status} → ${v.new_status}`;
  return `<div class="entry">
    <span class="when">${when}</span>
    <span>${escHtml(what)}</span>
    <span class="who">${escHtml(v.decided_by || '—')}</span>
    ${v.notes ? `<span class="note">${escHtml(v.notes)}</span>` : ''}
  </div>`;
}

// ─── Approve / Reject ───────────────────────────────────────────────────────
async function updateStatus(id, status, currentStatus) {
  // The field opens already filled with the existing notes, so its content
  // is the user's intent — an empty string included. Sending `null` instead
  // of empty would tell the server "don't touch them", making it impossible
  // to clear them.
  const note = document.getElementById(`notes-${id}`).value.trim();

  const label = status === 'approved' ? 'approvare' : 'rifiutare';
  const confirmMsg = currentStatus === 'pending'
    ? `Vuoi ${label} questa richiesta?`
    : `Stai annullando una decisione già comunicata all'osservatore, che riceverà`
      + ` una seconda email.\n\nVuoi ${label} questa richiesta?`;
  if (!confirm(confirmMsg)) return;

  try {
    const res = await fetch(`${API_BASE}/requests/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: status, reviewer_notes: note })
    });
    if (res.status === 409) {
      // Time slot overlap: the message names the conflicting request, and
      // that's the only thing that tells the reviewer what to move.
      showToast((await res.json()).detail, 'error');
      return;
    }
    if (res.status === 403) {
      showToast('Solo i responsabili possono approvare o rifiutare.', 'error');
      return;
    }
    if (!res.ok) throw new Error();

    const statusWordIt = status === 'approved' ? 'approvata' : 'rifiutata';
    const emoji = status === 'approved' ? '✓' : '✗';
    showToast(`${emoji} Richiesta ${statusWordIt} con successo.`, status === 'approved' ? 'success' : 'error');
    await loadRequests();

  } catch(e) {
    showToast('Errore durante l\'aggiornamento.', 'error');
  }
}

// `start` and `end` are observatory local time: the times are read as
// strings, so the browser's timezone doesn't shift them.
function timeRange(start, end) {
  return `${start.slice(11,16)} → ${end.slice(11,16)}`
       + (start.slice(0,10) === end.slice(0,10) ? '' : ' (+1g)');
}

// ─── Reschedule date and times ────────────────────────────────────────────
function localIsoWithTimezone(date) {
  date.setMinutes(date.getMinutes() - date.getTimezoneOffset());
  return date.toISOString().slice(0, 16);
}

function nightOf(instant) {
  const night = new Date(instant);
  if (instant.getHours() < 12) night.setDate(night.getDate() - 1);
  night.setHours(0, 0, 0, 0);
  return night;
}

function nightWindowEnd(startStr) {
  const windowEnd = nightOf(new Date(startStr));
  windowEnd.setDate(windowEnd.getDate() + 1);
  windowEnd.setHours(12, 0, 0, 0);
  return localIsoWithTimezone(windowEnd);
}

function updateRescheduleMax(id) {
  const start = document.getElementById(`reschedule-start-${id}`).value;
  if (start) document.getElementById(`reschedule-end-${id}`).max = nightWindowEnd(start);
}

async function rescheduleRequest(id) {
  const start  = document.getElementById(`reschedule-start-${id}`).value;
  const end    = document.getElementById(`reschedule-end-${id}`).value;
  const reason = document.getElementById(`reschedule-reason-${id}`).value.trim();

  if (!start || !end) {
    showToast('Indica il nuovo inizio e la nuova fine.', 'error'); return;
  }
  if (end <= start) {
    showToast('La fine deve essere successiva all\'inizio.', 'error'); return;
  }
  if (end > nightWindowEnd(start)) {
    showToast('La fine deve stare nella stessa notte dell\'inizio: non oltre le 12:00 del giorno dopo.', 'error'); return;
  }

  // Rescheduling into the past is allowed — it's needed to log an
  // observation that actually happened, after the fact — but it must be
  // stated, or a typo in the year would slip through silently.
  const confirmMsg = new Date(start) < new Date()
    ? 'Stai spostando questa osservazione in una data già trascorsa.\n\nConfermi?'
    : 'Confermi lo spostamento? L\'osservatore riceverà un avviso via email.';
  if (!confirm(confirmMsg)) return;

  try {
    const res = await fetch(`${API_BASE}/requests/${id}/schedule`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ start: start, end: end, reason: reason || null })
    });

    if (res.status === 409) {
      showToast((await res.json()).detail, 'error'); return;
    }
    if (res.status === 422) {
      showToast('Il server ha rifiutato gli orari: controlla e riprova.', 'error'); return;
    }
    if (res.status === 403) {
      showToast('Solo i responsabili possono spostare una richiesta.', 'error'); return;
    }
    if (!res.ok) throw new Error();

    showToast('🕒 Osservazione riprogrammata, avviso inviato all\'osservatore.', 'success');
    await loadRequests();

  } catch(e) {
    showToast('Errore durante lo spostamento.', 'error');
  }
}

// ─── Utility ───────────────────────────────────────────────────────────────
function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer = null;
function showToast(msg, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 4000);
}

// ─── Auto-refresh every 60s ───────────────────────────────────────────────
loadRequests();
setInterval(loadRequests, 60000);
</script>
</body>
</html>
