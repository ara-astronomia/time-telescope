# Compose for local DEVELOPMENT.
# Mounts the host code and starts uvicorn with --reload: editing a file
# takes effect immediately, no image rebuild needed.
# In production the service uses its own configuration on the deploy
# machine, not versioned here.
services:
  telescope_time:
    build: .
    container_name: telescope_time
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8010:8010"
    volumes:
      # The host's code takes precedence over the one copied into the
      # image. Excludes .venv: the one inside the container is for Linux
      # and the container's user, and must not be overwritten by the host's.
      - .:/app
      - /app/.venv
      # SQLite isn't the default on Docker (see DATABASE_URL below), but
      # the volume stays for anyone who wants to point at it explicitly.
      - telescope_db:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8010 --reload
    environment:
      - TELESCOPE_DB_PATH=/data/telescope_time.db
      # On Docker, development works against MariaDB almost always: the
      # same engine as production, no surprises discovered only at the end
      # of a story. SQLite stays the default only outside Docker (uv run,
      # with no other services to spin up on the host) — see
      # database_url() in router.py.
      - DATABASE_URL=mysql+pymysql://root:dev@mariadb/telescope_time
      # Time slots are the observatory's local time, and the server
      # compares them against its own: without this, a request for an hour
      # from now could come out as being in the past. Same variable for
      # the container's system timezone and the one read explicitly by
      # Python (router.now_at_observatory): keeping them separate would
      # only let them drift apart by mistake, and complicate comparing
      # logs against saved timestamps when debugging.
      - TZ=Europe/Rome
      # .pyc files written by the container would end up in the working copy.
      - PYTHONDONTWRITEBYTECODE=1
      # Simulated authentication: development doesn't need Authelia.
      # In production this must stay 'forward-auth' (the default).
      - AUTH_MODE=dev
      - DEV_USER=sviluppo
      - DEV_GROUPS=telescope-responsabili
      # SMTP — uncomment once available
      # - SMTP_HOST=smtp.example.com
      # - SMTP_PORT=587
      # - SMTP_USER=crac@osservatorio.it
      # - SMTP_PASSWORD=secret
      # - EMAIL_FROM=crac@osservatorio.it
      # - REVIEWER_EMAIL=responsabile@osservatorio.it

  # Default backend on Docker (#15): the same engine as production.
  # Fixed dev password: no production data here, ever (see #65/#15 —
  # there's no real data to protect).
  mariadb:
    image: mariadb:11
    container_name: telescope_time_mariadb
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=dev
      - MARIADB_DATABASE=telescope_time
    ports:
      - "13306:3306"
    volumes:
      - telescope_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  telescope_db:
    driver: local
  telescope_mariadb:
    driver: local
